<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>木更津一中指定上靴・カバン申し込みフォーム</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: #f5f6f8;
    margin: 0;
    padding: 24px;
    color: #333;
  }
  .container {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 8px;
    padding: 24px 28px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 20px; margin-bottom: 20px; }
  label {
    display: block;
    font-size: 14px;
    font-weight: bold;
    margin-top: 16px;
    margin-bottom: 6px;
  }
  input, select {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
  }
  button {
    margin-top: 24px;
    width: 100%;
    padding: 12px;
    background: #2b6cb0;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: pointer;
  }
  button:disabled { background: #999; cursor: default; }
  .message {
    margin-top: 16px;
    padding: 12px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.7;
  }
  .message.success { background: #e6f7ea; color: #1e7a34; }
  .message.error { background: #fdecea; color: #b3261e; }

  .note {
    font-weight: normal;
    color: #b3261e;
    font-size: 12px;
    margin-left: 6px;
  }
  .note-block {
    color: #b3261e;
    font-size: 12px;
    margin: 6px 0 0 0;
    line-height: 1.6;
  }
  .price-hint { font-weight: normal; color: #666; font-size: 12px; margin-left: 6px; }
  .red-text { color: #d00; font-weight: bold; }
  .summary { margin: 10px 0; padding: 10px 12px; background: #fff; border-radius: 4px; color: #333; }
  .summary div { margin: 2px 0; }
  .total { font-size: 16px; font-weight: bold; }

  /* 管理ページ用 */
  .admin-container { max-width: 960px; }
  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 13px; }
  th, td { border: 1px solid #e0e0e0; padding: 8px; text-align: left; white-space: nowrap; }
  th { background: #f0f2f5; }
  select.status-select { width: auto; padding: 4px 6px; font-size: 13px; }
  .cancel-btn { width: auto; padding: 6px 10px; font-size: 12px; background: #b3261e; margin-top: 0; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; }
  .reload-btn { width: auto; padding: 6px 14px; font-size: 13px; }
  .empty { color: #888; margin-top: 16px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ★この申し込みフォーム用に新しくデプロイしたGASのURLに差し替えてください
const GAS_URL = 'https://script.google.com/macros/s/AKfycbz3cGy1BjinlNbgKuyNYOfgtkljwETGmaJAJv6VnsZ0yoM4MUkE0EZlggwis61o_qOAPw/exec';

const SHOE_PRICE = 4070;   // 指定上靴（税込）
const BAG_PRICE = 9600;    // 指定カバン（税込）
const NONE = '購入なし';
const STATUS_OPTIONS = ['申込中', '対応済み', 'キャンセル'];

// サイズ一覧: 22〜28cmは0.5cm刻み、その上は1cm刻みで30cmまで
const SHOE_SIZES = [];
for (let s = 22; s <= 28; s += 0.5) SHOE_SIZES.push(s);
SHOE_SIZES.push(29, 30);

const params = new URLSearchParams(location.search);
const isAdmin = params.get('admin') === 'true';

async function callApi(action, data = {}) {
  try {
    const res = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...data })
    });
    if (!res.ok) throw new Error('サーバーエラー: ' + res.status);
    return await res.json();
  } catch (err) {
    console.error('API呼び出しでエラーが発生しました:', err);
    throw err;
  }
}

if (isAdmin) {
  renderAdminPage();
} else {
  renderCustomerForm();
}

function yen(n) { return n.toLocaleString('ja-JP') + '円'; }

// ===== お客さん用 申し込みフォーム =====
function renderCustomerForm() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="container">
      <h1>木更津一中指定上靴・カバン申し込みフォーム</h1>
      <form id="orderForm">
        <label for="name">お名前</label>
        <input type="text" id="name" required>

        <label for="phone">携帯電話番号</label>
        <input type="tel" id="phone" required>

        <label for="email">メールアドレス<span class="note">※携帯電話のメールアドレスのみ</span></label>
        <input type="email" id="email" required>

        <label for="shoes">指定上靴（R9年度カラー：イエロー）<span class="price-hint">${yen(SHOE_PRICE)}（税込）</span></label>
        <select id="shoes" required>
          <option value="">選択してください</option>
          <option value="${NONE}">${NONE}</option>
          ${SHOE_SIZES.map(s => `<option value="${s}cm">${s}cm</option>`).join('')}
        </select>
        <p class="note-block">※幅は2E(細め)となっています。4月から着用のため、成長を見越したサイズをご注文ください。<br>※22cm以下をご希望の方は、お早めにご来店いただきご試着をお願いいたします。</p>

        <label for="bag">指定カバン<span class="price-hint">${yen(BAG_PRICE)}（税込）</span></label>
        <select id="bag" required>
          <option value="">選択してください</option>
          <option value="購入">購入</option>
          <option value="${NONE}">${NONE}</option>
        </select>

        <button type="submit" id="submitBtn">申し込む</button>
      </form>
      <div id="message"></div>
    </div>
  `;

  const form = document.getElementById('orderForm');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const submitBtn = document.getElementById('submitBtn');
    const messageEl = document.getElementById('message');
    messageEl.innerHTML = '';

    const data = {
      name: document.getElementById('name').value,
      phone: document.getElementById('phone').value,
      email: document.getElementById('email').value,
      shoes: document.getElementById('shoes').value,
      bag: document.getElementById('bag').value
    };

    const buyShoes = data.shoes !== NONE;
    const buyBag = data.bag === '購入';
    if (!buyShoes && !buyBag) {
      messageEl.innerHTML = '<div class="message error">上靴・カバンのどちらも「購入なし」になっています。ご購入になる商品をお選びください。</div>';
      return;
    }
    data.total = (buyShoes ? SHOE_PRICE : 0) + (buyBag ? BAG_PRICE : 0);

    submitBtn.disabled = true;
    submitBtn.textContent = '送信中...';

    try {
      const result = await callApi('create', data);
      if (result.success) {
        form.reset();
        form.style.display = 'none';
        const lines = [];
        lines.push(`<div>指定上靴：${escapeHtml(data.shoes)}</div>`);
        lines.push(`<div>指定カバン：${escapeHtml(data.bag)}</div>`);
        const kind = buyShoes && buyBag ? 'どちらも購入' : (buyShoes ? '上靴のみ購入' : 'カバンのみ購入');
        messageEl.innerHTML = `
          <div class="message success">
            お申し込みを受け付けました<br>
            1～2日以内にお申し込み受付完了のメールを送らせていただきます。
            <div class="summary">
              ${lines.join('')}
              <div class="total">合計金額（${kind}）：${yen(data.total)}（税込）</div>
            </div>
            <div class="red-text">上靴のみは4,070円、カバンのみは9,600円、どちらも購入は13,670円。全て税込。<br>納品は2月末から3月頭を予定しております。ご用意できしだいメールにてご連絡いたします。</div>
            <br>【メール受信に関するご注意】<br>当店からの確認メールが届かない場合がございます。icloud.comからのメールを受信できるよう、ドメイン指定受信を設定してください。
          </div>`;
      } else {
        messageEl.innerHTML = `<div class="message error">申し込みに失敗しました: ${escapeHtml(result.message || '不明なエラー')}</div>`;
        submitBtn.disabled = false;
        submitBtn.textContent = '申し込む';
      }
    } catch (err) {
      messageEl.innerHTML = '<div class="message error">通信エラーが発生しました。時間をおいて再度お試しください。</div>';
      submitBtn.disabled = false;
      submitBtn.textContent = '申し込む';
    }
  });
}

// ===== オーナー用 管理ページ =====
function renderAdminPage() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="container admin-container">
      <div class="toolbar">
        <h1>申し込み管理</h1>
        <button class="reload-btn" id="reloadBtn">再読み込み</button>
      </div>
      <div id="adminBody">読み込み中...</div>
    </div>
  `;
  document.getElementById('reloadBtn').addEventListener('click', loadOrders);
  loadOrders();
}

async function loadOrders() {
  const adminBody = document.getElementById('adminBody');
  adminBody.textContent = '読み込み中...';
  try {
    const result = await callApi('list');
    if (!result.success) {
      adminBody.innerHTML = `<div class="message error">読み込みに失敗しました: ${escapeHtml(result.message || '不明なエラー')}</div>`;
      return;
    }
    renderTable(result.data);
  } catch (err) {
    adminBody.innerHTML = '<div class="message error">通信エラーが発生しました。</div>';
  }
}

function renderTable(rows) {
  const adminBody = document.getElementById('adminBody');
  if (!rows || rows.length === 0) {
    adminBody.innerHTML = '<p class="empty">申し込みはまだありません</p>';
    return;
  }

  adminBody.innerHTML = `
    <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>名前</th><th>携帯電話番号</th><th>メールアドレス</th>
          <th>上靴</th><th>カバン</th><th>合計金額</th><th>ステータス</th><th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
    </div>
  `;

  const tbody = document.getElementById('tableBody');
  rows.forEach(row => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${escapeHtml(row['名前'])}</td>
      <td>${escapeHtml(row['携帯電話番号'])}</td>
      <td>${escapeHtml(row['メールアドレス'])}</td>
      <td>${escapeHtml(row['上靴'])}</td>
      <td>${escapeHtml(row['カバン'])}</td>
      <td>${row['合計金額'] !== '' && row['合計金額'] !== undefined ? yen(Number(row['合計金額'])) : ''}</td>
      <td></td>
      <td></td>
    `;

    const statusSelect = document.createElement('select');
    statusSelect.className = 'status-select';
    STATUS_OPTIONS.forEach(opt => {
      const o = document.createElement('option');
      o.value = opt; o.textContent = opt;
      if (opt === row['ステータス']) o.selected = true;
      statusSelect.appendChild(o);
    });
    statusSelect.addEventListener('change', async () => {
      statusSelect.disabled = true;
      try {
        const result = await callApi('updateStatus', { id: row['ID'], status: statusSelect.value });
        if (!result.success) alert('更新に失敗しました: ' + (result.message || '不明なエラー'));
      } catch (err) {
        alert('通信エラーが発生しました');
      } finally {
        statusSelect.disabled = false;
      }
    });
    tr.children[6].appendChild(statusSelect);

    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'cancel-btn';
    cancelBtn.textContent = 'キャンセル';
    cancelBtn.addEventListener('click', async () => {
      if (!confirm('この申し込みをキャンセルしますか？')) return;
      cancelBtn.disabled = true;
      try {
        const result = await callApi('cancel', { id: row['ID'] });
        if (result.success) {
          loadOrders();
        } else {
          alert('キャンセルに失敗しました: ' + (result.message || '不明なエラー'));
          cancelBtn.disabled = false;
        }
      } catch (err) {
        alert('通信エラーが発生しました');
        cancelBtn.disabled = false;
      }
    });
    tr.children[7].appendChild(cancelBtn);

    tbody.appendChild(tr);
  });
}

function escapeHtml(str) {
  if (str === undefined || str === null) return '';
  return String(str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
</script>
</body>
</html>
